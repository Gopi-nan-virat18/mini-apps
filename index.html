<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Tap Rush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Tap Rush</h1>
      <p id="greeting" class="greeting" hidden></p>
      <p class="subtitle">Tap as many targets as you can in 30 seconds, then share your score</p>
    </header>

    <div class="hud">
      <div>Score <strong id="score">0</strong></div>
      <div>Time <strong id="time">30</strong>s</div>
      <div>Best <strong id="best">0</strong></div>
    </div>

    <div id="arena" class="arena">
      <div id="overlay" class="overlay">
        <p id="overlayText">Ready?</p>
        <button id="startBtn" type="button" class="btn btn-primary">Start</button>
      </div>
    </div>

    <section id="result" class="result" hidden>
      <img id="resultImg" class="result-img" src="celebration.avif" alt="Celebration" />
      <p id="resultText" class="result-text"></p>
      <button id="shareBtn" type="button" class="btn btn-primary">Share Score</button>
    </section>

    <div class="share-actions">
      <button id="challengeBtn" type="button" class="btn">Challenge Friends</button>
    </div>
    <p id="statusMsg" class="status" role="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
